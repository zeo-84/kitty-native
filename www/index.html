<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitty App 🎀</title>
  <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#EFA0AE">
  <link rel="icon" href="images/kitty_logo.webp" type="image/webp">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <span id="coin-badge" class="coin-badge"></span>
</head>

    <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>                               
  
<body>

  <!-- 🎬 اسپلش -->
  <div id="splash" class="screen">
    <img src="images/kitty_logo.webp" class="splash-logo" alt="logo">
    <h1 class="splash-title">Kitty App</h1>
    <div class="loader"></div>
  </div>

  <!-- 🎀 خوش‌آمدگویی -->
  <div id="onboarding" class="screen hidden">
    <img src="images/kitty_home.webp" class="big-mascot" alt="kitty">
    <h1 id="ob-title" class="ob-title"></h1>
    <p id="ob-sub" class="ob-sub"></p>
    <input id="ob-name" class="text-input" type="text">
    <p id="ob-error" class="error hidden"></p>
    <button id="ob-start" class="btn-primary"></button>
  </div>

  <!-- 🏠 اپ اصلی -->
  <div id="main" class="hidden">
    <header class="app-bar">
      <button id="lang-btn" class="icon-btn" title="Language"></button>
      <img src="images/kitty_logo.webp" class="app-logo" alt="logo">
      <span id="app-title" class="app-title"></span>
      <span class="spacer"></span>
    </header>

    <main id="content" class="content"></main>

    <nav class="bottom-nav" id="bottom-nav"></nav>
  </div>

  <script src="js/strings.js"></script>
  <script src="js/persian-date.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/workout.js"></script>
  <script src="js/notes.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/game.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/native.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
